name: Stage 1 A10 forced-two-speaker quality check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meeting-transcriber-stage1-validation
  cancel-in-progress: false
jobs:
  forced_two:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: ehime-kokubunsai-ai-poc
    env:
      TRANSCRIBER_GPU: A10
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ryotamatsuki/japanese-meeting-transcriber-colab
          ref: 719c296daa642d5f52e853cdcb5e7753419fb9a8
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare verified licensed Japanese two-speaker recording and Modal CLI
        run: |
          python -m pip install modal==1.4.3
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          mkdir -p local_runs
          python scripts/prepare_validation_audio.py
          cp local_audio/provenance.json local_runs/audio-provenance.json
      - name: GPU A10 Community-1 with num_speakers=2
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 360s python -m modal run modal_app.py --stage diarization --expected-speakers 2 --audio local_audio/kyoto_two_speakers.ogg --output local_runs/03-diar-2 2>&1 | tee local_runs/03-diar-2.log
          python scripts/validate_evidence.py local_runs/03-diar-2/evidence.json --stage diarization --expected-gpu A10
          python scripts/validate_run.py local_runs/03-diar-2/run-1.zip --stage diarization
      - name: GPU A10 integrated ASR + Community-1 with num_speakers=2
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 360s python -m modal run modal_app.py --stage full --expected-speakers 2 --audio local_audio/kyoto_two_speakers.ogg --output local_runs/04-full-2 2>&1 | tee local_runs/04-full-2.log
          python scripts/validate_evidence.py local_runs/04-full-2/evidence.json --stage full --expected-gpu A10
          python scripts/validate_run.py local_runs/04-full-2/run-1.zip
      - name: Assert two distinct speaker labels in diarization and integrated output
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          for folder in ('03-diar-2', '04-full-2'):
              with zipfile.ZipFile(Path('local_runs') / folder / 'run-1.zip') as z:
                  d = json.loads(z.read('pyannote_話者区間.json'))
                  ids = [s['speaker_id'] for s in d['segments']]
                  print(f'{folder}: intervals={len(ids)} unique_speakers={len(set(ids))} adjacent_switches={sum(a != b for a,b in zip(ids,ids[1:]))}')
                  assert d['settings']['expected'] == 2, 'Model did not receive requested speaker count'
                  assert len(set(ids)) == 2, 'Expected two speaker IDs from Community-1'
                  assert any(a != b for a,b in zip(ids,ids[1:])), 'No speaker boundary switch detected'
          PY
      - name: Retain sanitized outputs and execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-a10-fixed-two-${{ github.run_id }}
          path: local_runs/
          retention-days: 7
