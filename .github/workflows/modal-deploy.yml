name: Meeting ASR open-source-inspired A10 quality comparison
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meeting-transcriber-stage1-validation
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ehime-kokubunsai-ai-poc
    env:
      TRANSCRIBER_GPU: A10
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ryotamatsuki/japanese-meeting-transcriber-colab
          ref: acf5043c1bbd24d602c278c0491e56a063a8ba9f
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare public Japanese dialogue and community subtitles
        run: |
          python -m pip install modal==1.4.3
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET"
          mkdir -p local_runs
          python scripts/prepare_validation_audio.py
          cp local_audio/provenance.json local_runs/audio-provenance.json
          python - <<'PY'
          import urllib.request, pathlib
          url="https://commons.wikimedia.org/w/index.php?title=TimedText%3AKyoto_women_conversation_in_1964.ogg.ja.srt&action=raw"
          req=urllib.request.Request(url,headers={'User-Agent':'JapaneseMeetingTranscriberEvaluation/1.0 (public open-source comparative research)'})
          with urllib.request.urlopen(req,timeout=60) as r:
              content=r.read(100000)
          if b'-->' not in content or b'00:00:' not in content:
              raise ValueError('Reference subtitles are not raw SRT; refusing CER evaluation')
          pathlib.Path('local_audio/reference.srt').write_bytes(content)
          print('Reference subtitles checked; no subtitles or audio will be committed')
          PY
      - name: A10 baseline beam5 with word-attribution review
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 360s python -m modal run modal_app.py --stage full --expected-speakers 2 --quality-experiment --asr-beam-size 5 --audio local_audio/kyoto_two_speakers.ogg --output local_runs/asr-beam5 2>&1 | tee local_runs/asr-beam5.log
          python scripts/validate_evidence.py local_runs/asr-beam5/evidence.json --stage full --expected-gpu A10
          python scripts/validate_run.py local_runs/asr-beam5/run-1.zip
      - name: A10 candidate beam8 with same model/audio
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 360s python -m modal run modal_app.py --stage full --expected-speakers 2 --quality-experiment --asr-beam-size 8 --audio local_audio/kyoto_two_speakers.ogg --output local_runs/asr-beam8 2>&1 | tee local_runs/asr-beam8.log
          python scripts/validate_evidence.py local_runs/asr-beam8/evidence.json --stage full --expected-gpu A10
          python scripts/validate_run.py local_runs/asr-beam8/run-1.zip
      - name: Evaluate normalized CER and review flags
        run: |
          python scripts/evaluate_asr_cer.py --reference-srt local_audio/reference.srt --baseline local_runs/asr-beam5/run-1.zip --candidate local_runs/asr-beam8/run-1.zip --output local_runs/cer-comparison.json
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          for mode in ('asr-beam5','asr-beam8'):
              with ZipFile(Path('local_runs')/mode/'run-1.zip') as z:
                  review=json.loads(z.read('話者割当て要確認.json'))
                  asr=json.loads(z.read('whisper_asr.json'))
                  assert len(review['words']) > 0
                  assert asr['settings']['beam_size']==int(mode.split('beam')[1])
                  print(mode, 'review_words', review['review_words'], 'total', review['word_count'], 'flags',review['reason_counts'])
          PY
      - name: Preserve sanitized results and metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcriber-asr-open-source-quality-${{ github.run_id }}
          path: local_runs/
          retention-days: 7
