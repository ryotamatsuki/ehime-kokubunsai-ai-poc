name: Transcriber v0.1 one-hour synthetic smoke A10
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meeting-transcriber-stage1-validation
  cancel-in-progress: false
jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ehime-kokubunsai-ai-poc
    env:
      TRANSCRIBER_GPU: A10
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ryotamatsuki/japanese-meeting-transcriber-colab
          ref: 2cecc305c65876a68b18c616374d73bf6326817c
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare CC-BY licensed 60min SYNTHETIC REPEATED test recording
        run: |
          set -e
          python -m pip install modal==1.4.3 imageio-ffmpeg==0.6.0
          test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET"
          mkdir -p local_runs
          python scripts/prepare_validation_audio.py
          FFMPEG="$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -loglevel error -nostdin -y -stream_loop 106 -i local_audio/kyoto_two_speakers.ogg -t 3600 -ac 1 -ar 16000 -c:a libmp3lame -b:a 48k local_audio/synthetic_repeated_60m.mp3
          python - <<'PY'
          from pathlib import Path
          p=Path('local_audio/synthetic_repeated_60m.mp3')
          assert 5*1024*1024<p.stat().st_size<25*1024*1024
          print('Synthetic repeated public two-speaker audio size',p.stat().st_size,'bytes')
          PY
      - name: Run full real-GPU hour-long diarization plus ASR
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=60s 1140s python -m modal run modal_app.py --audio local_audio/synthetic_repeated_60m.mp3 --expected-speakers 2 --output local_runs/60min 2>&1 | tee local_runs/60min.log
          python scripts/validate_evidence.py local_runs/60min/evidence.json --stage full --expected-gpu A10
          python scripts/validate_run.py local_runs/60min/run-1.zip
      - name: Validate output covers recording tail without publishing transcript
        run: |
          python - <<'PY'
          import json,zipfile,pathlib
          e=json.loads(pathlib.Path('local_runs/60min/evidence.json').read_text())
          metrics=e['runs'][0]
          with zipfile.ZipFile('local_runs/60min/run-1.zip') as z:
              asr=json.loads(z.read('whisper_asr.json'))
              report=json.loads(z.read('処理レポート.json'))
              last=max(s['end'] for s in asr['segments'])
              result={'audio_seconds':metrics.get('audio_seconds'),'asr_last_end':last,'asr_segments':report['asr_segments'],'utterances':report['utterances'],'pipeline_seconds':metrics.get('pipeline_seconds'),'client_wall_seconds':e.get('client_wall_seconds'),'estimated_speakers':report['estimated_speakers'],'sampled_peak_gpu_mib':metrics.get('sampled_gpu_peak_mib')}
              pathlib.Path('local_runs/summary.json').write_text(json.dumps(result,indent=2))
              print('Synthetic 60min regression:',json.dumps(result))
              assert 3540<=metrics.get('audio_seconds',0)<=3601
              assert last>=3540,'Final minute not present in ASR'
          PY
      - name: Preserve sanitized technical metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcriber-v01-long-synthetic-${{ github.run_id }}
          path: |
            local_runs/summary.json
            local_runs/60min/evidence.json
            local_runs/60min.log
          retention-days: 7
