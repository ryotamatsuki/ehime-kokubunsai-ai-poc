name: Diarization quality A10 experimental side-by-side
on:
  push:
    branches:
      - eval/meeting-transcriber-stage1-20261030
    paths:
      - .github/workflows/modal-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meeting-transcriber-stage1-validation
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: ehime-kokubunsai-ai-poc
    env:
      TRANSCRIBER_GPU: A10
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ryotamatsuki/japanese-meeting-transcriber-colab
          ref: 679ecefc64cb681f61ab977d25174a192a318f90
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Modal and prepare consented public audio
        run: |
          python -m pip install modal==1.4.3
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          mkdir -p local_runs
          python scripts/prepare_validation_audio.py
          cp local_audio/provenance.json local_runs/audio-provenance.json
          python -m unittest tests.test_quality -v
      - name: GPU A10 fixed-two speaker quality diagnostics plus reversible cleanup
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 360s python -m modal run modal_app.py --stage full --expected-speakers 2 --quality-experiment --speaker-cleanup-ms 100 --audio local_audio/kyoto_two_speakers.ogg --output local_runs/quality-100 2>&1 | tee local_runs/quality-100.log
          python scripts/validate_evidence.py local_runs/quality-100/evidence.json --stage full --expected-gpu A10
          python scripts/validate_run.py local_runs/quality-100/run-1.zip
      - name: Validate original, standard and cleaned outputs without a reference accuracy claim
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          path=Path('local_runs/quality-100/run-1.zip')
          with zipfile.ZipFile(path) as z:
              raw=json.loads(z.read('pyannote_補正前話者区間.json'))['segments']
              normal=json.loads(z.read('pyannote_通常話者区間.json'))['segments']
              clean=json.loads(z.read('pyannote_話者区間.json'))['segments']
              report=json.loads(z.read('処理レポート.json'))
              ids=lambda xs:set(x['speaker_id'] for x in xs)
              switches=lambda xs:sum(a['speaker_id']!=b['speaker_id'] for a,b in zip(xs,xs[1:]))
              print(f'normal={len(normal)} normal_ids={len(ids(normal))} exclusive_raw={len(raw)} cleaned={len(clean)} raw_switches={switches(raw)} clean_switches={switches(clean)}')
              assert len(ids(raw))==len(ids(clean))==2
              assert switches(clean)<=switches(raw)
              assert report['diarization_settings']['speaker_cleanup_ms']==100
              assert len(raw)>=len(clean)
          PY
      - name: Preserve outputs (no original audio or HF credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-a10-quality-100-${{ github.run_id }}
          path: local_runs/
          retention-days: 7
