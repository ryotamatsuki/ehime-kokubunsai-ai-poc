name: Transcriber Stage 1 real GPU tests 2-6
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meeting-transcriber-stage1-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ehime-kokubunsai-ai-poc
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ryotamatsuki/japanese-meeting-transcriber-colab
          ref: f7aa4367080c247b20a2cdf0b932603d1b33a262
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SDK and check credentials without printing values
        run: |
          python -m pip install modal==1.4.3
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          mkdir -p local_runs
      - name: Prepare licensed Japanese two-speaker audio
        run: |
          python scripts/prepare_validation_audio.py
          cp local_audio/provenance.json local_runs/audio-provenance.json
      - name: Test 2 - large-v3 Japanese word timestamps (no HF Secret)
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 600s python -m modal run modal_app.py --stage asr --audio local_audio/kyoto_two_speakers.ogg --output local_runs/02-asr 2>&1 | tee local_runs/02-asr.log
          python scripts/validate_evidence.py local_runs/02-asr/evidence.json --stage asr
          python scripts/validate_run.py local_runs/02-asr/run-1.zip --stage asr
      - name: Test 3 - Community-1 estimated speaker count
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 600s python -m modal run modal_app.py --stage diarization --audio local_audio/kyoto_two_speakers.ogg --output local_runs/03-diar 2>&1 | tee local_runs/03-diar.log
          python scripts/validate_evidence.py local_runs/03-diar/evidence.json --stage diarization
          python scripts/validate_run.py local_runs/03-diar/run-1.zip --stage diarization
      - name: Test 4 - integrated output
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 600s python -m modal run modal_app.py --audio local_audio/kyoto_two_speakers.ogg --output local_runs/04-full 2>&1 | tee local_runs/04-full.log
          python scripts/validate_evidence.py local_runs/04-full/evidence.json --stage full
          python scripts/validate_run.py local_runs/04-full/run-1.zip
      - name: Test 5 - diarization OFF (no HF Secret)
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 600s python -m modal run modal_app.py --audio local_audio/kyoto_two_speakers.ogg --no-diarization --output local_runs/05-off 2>&1 | tee local_runs/05-off.log
          python scripts/validate_evidence.py local_runs/05-off/evidence.json --stage full --off
          python scripts/validate_run.py local_runs/05-off/run-1.zip --off
      - name: Test 6a - offline model weights reload and real inference
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 600s python -m modal run modal_app.py --audio local_audio/kyoto_two_speakers.ogg --repeat 2 --output local_runs/06-model-cache 2>&1 | tee local_runs/06-model-cache.log
          python scripts/validate_evidence.py local_runs/06-model-cache/evidence.json --stage full --cache-mode model
      - name: Test 6b - result JSON reuse
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 600s python -m modal run modal_app.py --audio local_audio/kyoto_two_speakers.ogg --repeat 2 --result-cache --output local_runs/07-result-cache 2>&1 | tee local_runs/07-result-cache.log
          python scripts/validate_evidence.py local_runs/07-result-cache/evidence.json --stage full --cache-mode result
      - name: Upload evidence and output archives (no input audio or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcriber-stage1-tests2-6-${{ github.run_id }}
          path: local_runs/
          retention-days: 7
