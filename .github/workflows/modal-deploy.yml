name: AMI reference-labelled speaker quality benchmark
on:
  push:
    branches:
      - eval/meeting-transcriber-stage1-20261030
    paths:
      - .github/workflows/modal-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meeting-transcriber-stage1-validation
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    environment: ehime-kokubunsai-ai-poc
    env:
      TRANSCRIBER_GPU: A10
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ryotamatsuki/japanese-meeting-transcriber-colab
          ref: f57f80e53d8517c645b4830863ca12eec3c565de
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare public AMI one-minute meeting excerpt and human RTTM reference
        run: |
          python -m pip install modal==1.4.3 pyannote.metrics==4.1 imageio-ffmpeg==0.6.0
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          mkdir -p local_audio local_runs
          curl --retry 2 --connect-timeout 20 --max-time 150 -fLsS -o local_audio/full-ami.wav 'https://groups.inf.ed.ac.uk/ami/AMICorpusMirror/amicorpus/ES2004a/audio/ES2004a.Mix-Headset.wav'
          FFMPEG="$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -loglevel error -nostdin -y -ss 300 -t 60 -i local_audio/full-ami.wav -ac 1 -ar 16000 -c:a pcm_s16le local_audio/ami_300_360.wav
          rm local_audio/full-ami.wav
          python - <<'PY'
          import urllib.request, pathlib
          url='https://raw.githubusercontent.com/pyannote/AMI-diarization-setup/main/only_words/rttms/test/ES2004a.rttm'
          lines=urllib.request.urlopen(url,timeout=35).read().decode().splitlines()
          reference=[]
          for line in lines:
              p=line.split()
              if len(p)!=10 or p[0]!='SPEAKER':continue
              s=float(p[3]);e=s+float(p[4])
              a=max(s,300);b=min(e,360)
              if b<=a:continue
              p[3]=f'{a-300:.6f}';p[4]=f'{b-a:.6f}';p[1]='ami_300_360'
              reference.append(' '.join(p))
          assert len(reference)>8, 'Unexpected empty reference'
          pathlib.Path('local_audio/ami_300_360.rttm').write_text('\n'.join(reference)+'\n')
          print(f'AMI human-annotated only_words reference turns={len(reference)}, distinct speakers={len(set(x.split()[7] for x in reference))}')
          PY
      - name: Real A10 Community-1 plus conservative 100ms cleanup
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 420s python -m modal run modal_app.py --stage diarization --expected-speakers 4 --quality-experiment --speaker-cleanup-ms 100 --audio local_audio/ami_300_360.wav --output local_runs/ami-diar 2>&1 | tee local_runs/ami-diar.log
          python scripts/validate_evidence.py local_runs/ami-diar/evidence.json --stage diarization --expected-gpu A10
          python scripts/validate_run.py local_runs/ami-diar/run-1.zip --stage diarization
      - name: Score strict reference DER and JER, before and after postprocessing
        run: |
          set -o pipefail
          for mode in unmodified exclusive standard; do
            python scripts/evaluate_diarization.py --rttm local_audio/ami_300_360.rttm --zip local_runs/ami-diar/run-1.zip --candidate "$mode" --collar 0 | tee "local_runs/score-${mode}.json"
          done
          python scripts/evaluate_diarization.py --rttm local_audio/ami_300_360.rttm --zip local_runs/ami-diar/run-1.zip --candidate exclusive --collar 0.25 | tee local_runs/score-exclusive-collar025.json
      - name: Preserve results and official RTTM excerpt but not the audio signal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcriber-ami-reference-benchmark-${{ github.run_id }}
          path: |
            local_runs/
            local_audio/ami_300_360.rttm
          retention-days: 7
