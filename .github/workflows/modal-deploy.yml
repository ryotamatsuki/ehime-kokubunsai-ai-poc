name: v0.1 isolated Modal private beta full E2E smoke
on:
  push:
    branches:
      - eval/meeting-transcriber-stage1-20261030
    paths:
      - .github/workflows/modal-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meeting-transcriber-stage1-validation
  cancel-in-progress: false
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ehime-kokubunsai-ai-poc
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ryotamatsuki/japanese-meeting-transcriber-colab
          ref: e7a0d42f64b4fcef3c6392aa4310f0c888655624
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test client and Modal SDK
        run: |
          python -m pip install modal==1.4.3 httpx==0.28.1
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          mkdir -p local_runs
          python scripts/prepare_validation_audio.py
      - name: Create isolated environment, ephemeral credentials, deploy, test and destroy
        shell: bash
        run: |
          set -euo pipefail
          env_name="transcriber-v01-smoke-${GITHUB_RUN_ID}"
          created=0
          cleanup() {
            if [[ "$created" == 1 ]]; then
              modal environment delete -y "$env_name" > /tmp/beta-teardown.log 2>&1 || {
                echo "ISOLATED_ENV_CLEANUP_FAILED: $env_name"; cat /tmp/beta-teardown.log; return 1;
              }
              echo "ISOLATED_ENV_CLEANUP_SUCCEEDED"
            fi
          }
          trap cleanup EXIT
          modal environment create "$env_name"
          created=1
          export BETA_SMOKE_PASSWORD
          BETA_SMOKE_PASSWORD="$(openssl rand -hex 20)"
          export BETA_SESSION_SECRET
          BETA_SESSION_SECRET="$(openssl rand -hex 36)"
          echo "::add-mask::$BETA_SMOKE_PASSWORD"
          echo "::add-mask::$BETA_SESSION_SECRET"
          # Dummy HF token is unused because this test explicitly disables diarization.
          modal secret create -e "$env_name" transcriber-hf HF_TOKEN="offline_asr_only_dummy_token"
          modal secret create -e "$env_name" transcriber-beta-auth "BETA_PASSWORD=$BETA_SMOKE_PASSWORD" "BETA_SESSION_SECRET=$BETA_SESSION_SECRET"
          timeout --signal=TERM --kill-after=20s 780s modal deploy -e "$env_name" beta_modal.py 2>&1 | tee /tmp/beta-deploy.log
          export BETA_SMOKE_URL
          BETA_SMOKE_URL="$(python - "$env_name" <<'PY'
          import modal,sys
          f=modal.Function.from_name(
              'japanese-meeting-transcriber-private-beta','private_web',
              environment_name=sys.argv[1])
          url=f.get_web_url()
          if not url or not url.startswith('https://'):
              raise SystemExit('Modal did not expose the beta web function URL')
          print(url)
          PY
          )"
          timeout --signal=TERM --kill-after=20s 770s python scripts/smoke_beta_live.py
          echo 'PRIVATE_BETA_EPHEMERAL_E2E_COMPLETE; cleanup follows'
      - name: Preserve sanitized smoke result and test parameters only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcriber-v01-isolated-e2e-${{ github.run_id }}
          path: local_runs/smoke_result.json
          if-no-files-found: warn
          retention-days: 7
