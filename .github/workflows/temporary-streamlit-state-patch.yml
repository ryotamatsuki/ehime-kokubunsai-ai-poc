name: Temporary Streamlit state patch

on:
  push:
    branches:
      - fix/streamlit-recommendation-state

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: stabilize Streamlit next-event state') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/streamlit-recommendation-state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply minimal state fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('streamlit_app.py')
          text = path.read_text()
          old = 'native_plan = None if skip_generation and pending_state else command_payload'
          new = 'native_plan = command_payload'
          if old in text:
              text = text.replace(old, new, 1)

          old = '''    prefer_router_reference = route.action_type in {\n        "detail_followup",\n        "explain_search",\n        "explain_result",\n        "clarify_reference",\n    } or ('''
          new = '''    prefer_router_reference = route.action_type in {\n        "detail_followup",\n        "explain_search",\n        "explain_result",\n        "clarify_reference",\n        "recommend_next",\n        "recommend_next_without_selection",\n    } or ('''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''        and agent_orchestrator.should_use_agentic_search(\n        prompt,'''
          new = '''        and route.action_type not in {"recommend_next", "recommend_next_without_selection"}\n        and agent_orchestrator.should_use_agentic_search(\n        prompt,'''
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('command_orchestrator.py')
          text = path.read_text()
          old = '''        day = self.reference_date\n        if slots.dates:\n            day = date.fromisoformat(slots.dates[0])'''
          new = '''        schedule = event_details.normalize_schedule(selected)\n        day = self.reference_date\n        if slots.dates:\n            day = date.fromisoformat(slots.dates[0])\n        elif schedule.start_date == schedule.end_date:\n            # A selected single-day event is itself authoritative for the\n            # recommendation day. Never substitute the PoC current date.\n            day = schedule.start_date'''
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Verify focused regressions
        run: |
          python -m compileall -q streamlit_app.py command_orchestrator.py
          python -m pip install -q pytest
          python -m pytest -q tests/test_streamlit_state_regressions.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add streamlit_app.py command_orchestrator.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: stabilize Streamlit next-event state"
          git push origin HEAD:fix/streamlit-recommendation-state
