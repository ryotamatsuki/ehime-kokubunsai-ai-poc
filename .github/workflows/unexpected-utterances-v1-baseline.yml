name: Unexpected User Utterances v1 baseline

on:
  push:
    branches:
      - test/unexpected-utterances-v1-baseline-run

permissions:
  contents: read

concurrency:
  group: unexpected-utterances-v1-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    environment: ehime-kokubunsai-ai-poc
    timeout-minutes: 120
    steps:
      - name: Check out baseline code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install evaluation dependencies
        run: python -m pip install --upgrade -r requirements.txt modal fastapi

      - name: Validate frozen fixture and evaluator
        run: |
          python -m compileall -q unexpected_utterances_eval.py unexpected_utterances_live_eval.py
          python unexpected_utterances_eval.py

      - name: Run frozen 100-case baseline
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          mkdir -p artifacts
          modal run --quiet \
            --write-result artifacts/unexpected_utterances_v1_baseline.json \
            unexpected_utterances_live_eval.py::run \
            --limit 100 \
            --format-enforcer baseline

      - name: Record run metadata
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = {
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "ref": os.environ.get("GITHUB_REF"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
          }
          Path("artifacts/unexpected_utterances_v1_run_metadata.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8",
          )
          PY

      - name: Print non-raw summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/unexpected_utterances_v1_baseline.json")
          if not path.exists():
              print("baseline artifact: unavailable")
              raise SystemExit(0)
          payload = json.loads(path.read_text(encoding="utf-8"))
          print(json.dumps({
              "model": payload.get("model"),
              "format_enforcer": payload.get("format_enforcer"),
              "fixture_contract": payload.get("fixture_contract"),
              "summary": payload.get("summary"),
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unexpected-utterances-v1-baseline-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
