name: Apply model selector patch

# Temporary branch-only workflow: patches the large Streamlit entrypoint,
# verifies it, then commits only streamlit_app.py.
on:
  push:
    branches:
      - feature/model-selector-llmjp-v22

permissions:
  contents: write

concurrency:
  group: apply-model-selector-patch
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[model-selector-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/model-selector-llmjp-v22
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'lm-format-enforcer>=0.10,<1'

      - name: Apply guarded patch
        run: python tools/apply_model_selector_patch.py

      - name: Compile
        run: python -m compileall -q .

      - name: Run regression tests
        run: PYTHONPATH=. python -m pytest -q

      - name: Verify v2.2 oracle remains 100/100
        run: |
          PYTHONPATH=. python - <<'PY'
          from semantic_oracle_ceiling_v2_2 import evaluate_oracle_v22
          result = evaluate_oracle_v22()
          assert result['cases'] == 100
          assert result['machine_pass'] == 100, result['failed']
          print('v2.2 oracle: 100/100 PASS')
          PY

      - name: Verify sealed holdout remains opaque
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('tests/data/unexpected_utterances_holdout_v2_1')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          payload = root / manifest['payload']
          digest = hashlib.sha256(payload.read_bytes()).hexdigest()
          assert digest == manifest['payload_sha256']
          assert digest == 'c844dda17248c0e7f16cd2985652e62bb0f8b601bf21196d6801479580899c92'
          print(json.dumps({'opened': False, 'sha256': digest}, ensure_ascii=False))
          PY

      - name: Commit Streamlit wiring
        run: |
          if git diff --quiet -- streamlit_app.py; then
            echo 'Streamlit patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streamlit_app.py
          git commit -m 'feat: wire selectable v2.2 models [model-selector-applied]'
          git push origin HEAD:feature/model-selector-llmjp-v22
