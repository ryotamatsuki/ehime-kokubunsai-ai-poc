name: Semantic v2.3 Evidence-Bounded Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - feature/semantic-operations-v2-3-evidence-bounded
  pull_request:
    branches:
      - feature/model-selector-llmjp-v22

permissions:
  contents: read

concurrency:
  group: semantic-v2-3-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade -r requirements.txt 'lm-format-enforcer>=0.10,<1'
      - name: Compile
        run: python -m compileall -q .
      - name: Run standalone deterministic QA
        run: |
          python tests/run_search_v2_qa.py
          python tests/run_conversation_router_qa.py
          python tests/run_conversational_recovery_qa.py
          python tests/run_recovery_v2_qa.py
          python tests/run_participation_qa.py
          python tests/run_recommendation_qa.py
          python tests/run_pending_recommendation_qa.py
          python tests/run_agentic_search_qa.py
          python tests/run_command_semantic_qa.py
          python tests/run_security_qa.py
          python tests/run_recovery_benchmark.py
      - name: Run full pytest regression
        run: PYTHONPATH=. python -m pytest -q
      - name: Validate v2.3 LMFE schema
        run: |
          PYTHONPATH=. python - <<'PY'
          from lmformatenforcer import JsonSchemaParser
          from semantic_atomic_v2_3 import ATOMIC_FRAME_JSON_SCHEMA_V23
          JsonSchemaParser(ATOMIC_FRAME_JSON_SCHEMA_V23)
          assert ATOMIC_FRAME_JSON_SCHEMA_V23['additionalProperties'] is False
          assert 'data_gap' not in ATOMIC_FRAME_JSON_SCHEMA_V23['properties']
          assert 'clarification' not in ATOMIC_FRAME_JSON_SCHEMA_V23['properties']
          print('LMFE v2.3 closed schema: PASS')
          PY
      - name: Run v2.2 regression oracle ceiling
        run: |
          PYTHONPATH=. python - <<'PY'
          from semantic_oracle_ceiling_v2_2 import evaluate_oracle_v22
          result = evaluate_oracle_v22()
          assert result['cases'] == 100
          assert result['machine_pass'] == 100, result['failed']
          print('v2.2 oracle: 100/100 PASS')
          PY
      - name: Run v2.3 frozen-v1 oracle ceiling
        run: |
          PYTHONPATH=. python - <<'PY'
          from semantic_oracle_ceiling_v2_3 import evaluate_oracle_v23
          result = evaluate_oracle_v23()
          print('v2.3 oracle:', result['machine_pass'], '/', result['cases'])
          if result['failed']:
              print('failed:', result['failed'])
          assert result['cases'] == 100
          assert result['machine_pass'] == 100, result['failed']
          PY
      - name: Verify one-call and model-parity source contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          orchestrator = Path('semantic_orchestrator_v2_3.py').read_text(encoding='utf-8')
          verifier = Path('semantic_verifier_v2_3.py').read_text(encoding='utf-8')
          backend = Path('semantic_v2_3_multimodel_backend.py').read_text(encoding='utf-8')
          assert 'repair' not in orchestrator.lower()
          assert 'sarashina' not in orchestrator.lower() and 'llm-jp' not in orchestrator.lower()
          assert 'sarashina' not in verifier.lower() and 'llm-jp' not in verifier.lower()
          assert backend.count('gpu="T4"') == 2
          assert 'do_sample=False' in backend
          assert 'repetition_penalty=1.02' in backend
          print('one-call/model-parity contracts: PASS')
          PY
      - name: Verify v2.3 source cannot access sealed holdout or live runner
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = (
              'semantic_evidence_v2_3.py',
              'semantic_capability_registry_v2_3.py',
              'semantic_atomic_v2_3.py',
              'semantic_prompt_v2_3.py',
              'semantic_verifier_v2_3.py',
              'semantic_state_v2_3.py',
              'semantic_orchestrator_v2_3.py',
              'semantic_oracle_ceiling_v2_3.py',
              'unexpected_utterances_v2_3_eval.py',
              'semantic_v2_3_multimodel_backend.py',
          )
          forbidden = (
              'unexpected_utterances_holdout_v2_1',
              'holdout.json.gz',
              'semantic_v2_3_live_eval',
              'frozen_v1_eval.remote',
          )
          for path in paths:
              source = Path(path).read_text(encoding='utf-8')
              for marker in forbidden:
                  assert marker not in source, (path, marker)
          print('sealed/live execution boundary: PASS')
          PY
      - name: Verify sealed holdout remains opaque and unchanged
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('tests/data/unexpected_utterances_holdout_v2_1')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          payload = root / manifest['payload']
          digest = hashlib.sha256(payload.read_bytes()).hexdigest()
          assert manifest['sealed_before_v2_1_implementation'] is True
          assert manifest['total_cases'] == 200
          assert digest == 'c844dda17248c0e7f16cd2985652e62bb0f8b601bf21196d6801479580899c92'
          assert digest == manifest['payload_sha256']
          print(json.dumps({'payload_sha256': digest, 'opened': False, 'executed': False}, sort_keys=True))
          PY
