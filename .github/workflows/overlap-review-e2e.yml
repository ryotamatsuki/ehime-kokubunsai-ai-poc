name: v0.1 overlap-review Japanese dialogue live Web-to-GPU E2E
on:
  push:
    branches: [eval/meeting-transcriber-stage1-20261030]
    paths: [.github/workflows/overlap-review-e2e.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meeting-transcriber-stage1-validation
  cancel-in-progress: false
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    environment: ehime-kokubunsai-ai-poc
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ryotamatsuki/japanese-meeting-transcriber-colab
          ref: 270e5dbfc9175068fb3915b3cf25a0f5a9ae205a
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test client and Modal SDK
        run: |
          python -m pip install -r requirements-beta-test.txt modal==1.4.3 imageio-ffmpeg==0.6.0
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
          mkdir -p local_runs
          mkdir -p local_audio
          root="https://huggingface.co/datasets/IngCrowd/japanese-themed-dialogue/resolve/main/japanese-themed-dialogue01/japanese-themed-dialogue01"
          curl -fLsS --retry 3 --connect-timeout 25 --max-time 240 --output local_audio/01.wav "${root}_audio.wav?download=true"
          curl -fLsS --retry 3 --connect-timeout 25 --max-time 150 --output local_audio/01.eaf "${root}.eaf?download=true"
          FFMPEG="$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -loglevel error -nostdin -y -i local_audio/01.wav -ac 1 -ar 16000 -b:a 48k local_audio/01.mp3
          rm -f local_audio/01.wav
          test "$(wc -c < local_audio/01.mp3)" -gt 1000000
          python -m unittest tests.test_evaluate_overlap_review tests.test_beta_overlap_review -v
      - name: Create isolated environment, ephemeral credentials, deploy, test and destroy
        shell: bash
        run: |
          set -euo pipefail
          env_name="transcriber-v01-smoke-${GITHUB_RUN_ID}"
          created=0
          cleanup() {
            if [[ "$created" == 1 ]]; then
              modal environment delete -y "$env_name" > /tmp/beta-teardown.log 2>&1 || {
                echo "ISOLATED_ENV_CLEANUP_FAILED: $env_name"; cat /tmp/beta-teardown.log; return 1;
              }
              echo "ISOLATED_ENV_CLEANUP_SUCCEEDED"
            fi
          }
          trap cleanup EXIT
          modal environment create "$env_name"
          created=1
          export BETA_SMOKE_PASSWORD
          BETA_SMOKE_PASSWORD="$(openssl rand -hex 20)"
          export BETA_SESSION_SECRET
          BETA_SESSION_SECRET="$(openssl rand -hex 36)"
          echo "::add-mask::$BETA_SMOKE_PASSWORD"
          echo "::add-mask::$BETA_SESSION_SECRET"
          # Reference the preexisting HF Secret from 'main' without reading or copying its values.
          # This source rewrite is ephemeral in the Actions checkout only.
          python - <<'PY'
          from pathlib import Path
          p=Path('beta_modal.py')
          s=p.read_text()
          before="modal.Secret.from_name('transcriber-hf',required_keys=['HF_TOKEN'])"
          after="modal.Secret.from_name('transcriber-hf',environment_name='main',required_keys=['HF_TOKEN'])"
          assert s.count(before)==1, 'Missing expected speaker-token reference'
          p.write_text(s.replace(before,after))
          PY
          modal secret create -e "$env_name" transcriber-beta-auth "BETA_PASSWORD=$BETA_SMOKE_PASSWORD" "BETA_SESSION_SECRET=$BETA_SESSION_SECRET"
          timeout --signal=TERM --kill-after=20s 780s modal deploy -e "$env_name" beta_modal.py 2>&1 | tee /tmp/beta-deploy.log
          export BETA_SMOKE_URL
          BETA_SMOKE_URL="$(python - "$env_name" <<'PY'
          import modal,sys
          f=modal.Function.from_name(
              'japanese-meeting-transcriber-private-beta','private_web',
              environment_name=sys.argv[1])
          url=f.get_web_url()
          if not url or not url.startswith('https://'):
              raise SystemExit('Modal did not expose the beta web function URL')
          print(url)
          PY
          )"
          export BETA_SMOKE_DIARIZATION=1
          export BETA_SMOKE_AUDIO_PATH=local_audio/01.mp3
          export BETA_SMOKE_REF_EAF=local_audio/01.eaf
          export BETA_REQUIRE_OVERLAP_CANDIDATES=1
          export BETA_SMOKE_MAX_POLLS=225
          timeout --signal=TERM --kill-after=30s 940s python scripts/smoke_beta_live.py
          echo 'PRIVATE_BETA_EPHEMERAL_E2E_COMPLETE; cleanup follows'
      - name: Preserve sanitized smoke result and test parameters only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcriber-v01-overlap-review-E2E-${{ github.run_id }}
          path: local_runs/smoke_result.json
          if-no-files-found: warn
          retention-days: 7
