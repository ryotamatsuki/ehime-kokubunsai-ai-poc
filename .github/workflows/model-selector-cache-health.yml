name: Verify active LLM-jp cache health

on:
  push:
    branches:
      - feature/model-selector-llmjp-v22
    paths:
      - .github/workflows/model-selector-cache-health.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: ehime-kokubunsai-ai-poc
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade modal
      - name: Inspect active fixed cache task and partial file inventory
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          echo '--- fixed cache task logs ---'
          modal app logs ap-cDcoLzJAWvRbmTEDQPkFEH --since 10m --tail 300 --timestamps || true
          echo '--- LLM-jp model directory ---'
          modal volume ls --json ehime-kokubunsai-llmjp-4-8b-cache /llm-jp-4-8b-instruct || true
