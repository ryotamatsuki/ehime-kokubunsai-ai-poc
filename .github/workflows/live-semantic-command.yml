name: Live Semantic Command evaluation

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Single-turn case count"
        required: false
        default: "80"
      dialogue_limit:
        description: "Multi-turn dialogue count"
        required: false
        default: "20"
      format_enforcer:
        description: "Command output guard"
        required: false
        type: choice
        options:
          - baseline
          - lmfe
        default: baseline
      include_raw:
        description: "Include bounded raw model outputs in the artifact"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-semantic-command-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    environment: ehime-kokubunsai-ai-poc
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install live evaluation dependencies
        run: python -m pip install --upgrade -r requirements.txt modal fastapi

      - name: Run live Semantic Command evaluation
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          mkdir -p artifacts
          modal run --quiet \
            --write-result artifacts/live_semantic_command_eval.json \
            modal_backend.py::live_semantic_command_eval \
            --limit "${{ inputs.limit }}" \
            --dialogue-limit "${{ inputs.dialogue_limit }}" \
            --format-enforcer "${{ inputs.format_enforcer }}" \
            --include-raw "${{ inputs.include_raw }}"

      - name: Upload live evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-semantic-command-evaluation-${{ github.run_id }}
          path: artifacts/live_semantic_command_eval.json
          if-no-files-found: warn
