name: Smoke selectable Semantic v2.2 endpoints

on:
  push:
    branches:
      - feature/model-selector-llmjp-v22
    paths:
      - .github/workflows/model-selector-endpoint-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: ehime-kokubunsai-ai-poc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/model-selector-llmjp-v22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade modal requests jsonschema 'fastapi[standard]' pytest 'lm-format-enforcer>=0.10,<1'

      - name: Wait for committed LLM-jp cache
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            modal volume ls --json ehime-kokubunsai-llmjp-4-8b-cache /llm-jp-4-8b-instruct > volume.json 2>/dev/null || echo '[]' > volume.json
            if python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('volume.json').read_text())
          text = json.dumps(payload, ensure_ascii=False)
          required = [
              'config.json',
              'model.safetensors.index.json',
              'model-00001-of-00004.safetensors',
              'model-00002-of-00004.safetensors',
              'model-00003-of-00004.safetensors',
              'model-00004-of-00004.safetensors',
              'tokenizer_config.json',
          ]
          missing = [name for name in required if name not in text]
          if missing:
              print('cache markers missing:', missing)
              raise SystemExit(1)
          print('LLM-jp committed cache markers: PASS')
          PY
            then
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              echo 'LLM-jp cache did not become ready within 60 minutes' >&2
              exit 1
            fi
            echo "cache not committed yet: ${attempt}/120"
            sleep 30
          done

      - name: Deploy latest selectable v2.2 endpoints
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy semantic_v2_2_multimodel_backend.py

      - name: Exercise both authenticated endpoints
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urlparse
          import modal
          import requests
          from jsonschema import validate
          from semantic_atomic_v2_2 import ATOMIC_FRAME_JSON_SCHEMA
          from semantic_model_registry import MODEL_SPECS, resolve_model_url

          if not os.environ.get('MODAL_TOKEN_ID') or not os.environ.get('MODAL_TOKEN_SECRET'):
              raise RuntimeError('Modal API credentials are not configured')

          def assert_safe_redirect_chain(initial_url, response):
              initial = urlparse(initial_url)
              for hop in (*response.history, response):
                  current = urlparse(hop.url)
                  if (
                      current.scheme != 'https'
                      or current.hostname != initial.hostname
                      or current.path not in {'', '/'}
                      or current.username
                      or current.password
                      or current.fragment
                  ):
                      raise RuntimeError(f'unsafe Modal redirect: {hop.url}')

          workspace = modal.Workspace.from_context()
          token = workspace.proxy_tokens.create()
          try:
              try:
                  workspace.proxy_tokens.allow(token.token_id, 'main')
              except Exception as exc:
                  print(f'proxy-token allow(main) not required: {type(exc).__name__}')

              headers = {
                  'Modal-Key': token.token_id,
                  'Modal-Secret': token.token_secret,
                  'Content-Type': 'application/json',
              }
              payload = {
                  'query': '松山市で無料のイベントを探したい',
                  'state': {},
                  'grounded': {},
                  'format_enforcer': 'lmfe',
              }

              for spec in MODEL_SPECS:
                  url = resolve_model_url(spec, {})
                  if not url.startswith('https://'):
                      raise RuntimeError(f'{spec.key}: invalid endpoint URL')
                  body = None
                  last_error = None
                  for attempt in range(1, 13):
                      try:
                          with requests.Session() as session:
                              session.max_redirects = 8
                              response = session.post(
                                  url,
                                  headers=headers,
                                  json=payload,
                                  timeout=300,
                                  allow_redirects=True,
                              )
                          assert_safe_redirect_chain(url, response)
                      except requests.RequestException as exc:
                          last_error = f'{type(exc).__name__}: {exc}'
                          print(f'{spec.key} attempt {attempt}/12 transport not ready: {last_error[:500]}')
                          if attempt < 12:
                              time.sleep(20)
                              continue
                          raise

                      if response.status_code >= 500:
                          last_error = f'HTTP {response.status_code}: {response.text[:300]}'
                          print(f'{spec.key} attempt {attempt}/12 backend not ready: {last_error}')
                          if attempt < 12:
                              time.sleep(20)
                              continue
                      if response.status_code != 200:
                          raise RuntimeError(f'{spec.key}: HTTP {response.status_code}: {response.text[:300]}')
                      body = response.json()
                      break

                  if body is None:
                      raise RuntimeError(f'{spec.key} endpoint smoke failed: {last_error}')
                  if body.get('service_id') != 'ehime-kokubunsai-semantic-v2-2-api':
                      raise RuntimeError(f'{spec.key}: unexpected service_id: {body.get("service_id")}')
                  if body.get('model_key') != spec.key:
                      raise RuntimeError(f'{spec.key}: unexpected model_key: {body.get("model_key")}')
                  if body.get('model_id') != spec.model_id:
                      raise RuntimeError(f'{spec.key}: unexpected model_id: {body.get("model_id")}')
                  answer = body.get('answer')
                  if not isinstance(answer, str) or not answer.strip():
                      raise RuntimeError(f'{spec.key}: empty answer: {body.get("error")}')
                  frame = json.loads(answer)
                  validate(frame, ATOMIC_FRAME_JSON_SCHEMA)
                  obs = body.get('observability') or {}
                  print(json.dumps({
                      'model_key': spec.key,
                      'status': 'PASS',
                      'redirects': len(response.history),
                      'prompt_tokens': obs.get('prompt_tokens'),
                      'generated_tokens': obs.get('generated_tokens'),
                      'container_setup_ms': obs.get('container_setup_ms'),
                      'model_load_ms': obs.get('model_load_ms'),
                      'server_total_ms': obs.get('server_total_ms'),
                  }, ensure_ascii=False))
          finally:
              workspace.proxy_tokens.delete(token.token_id)
              print('ephemeral proxy token deleted')
          PY
