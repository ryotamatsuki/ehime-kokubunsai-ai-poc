name: Smoke selectable Semantic v2.2 endpoints

on:
  push:
    branches:
      - feature/model-selector-llmjp-v22
    paths:
      - .github/workflows/model-selector-endpoint-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: ehime-kokubunsai-ai-poc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/model-selector-llmjp-v22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests jsonschema
      - name: Exercise both authenticated endpoints
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          import os
          import time
          import requests
          from jsonschema import validate
          from semantic_atomic_v2_2 import ATOMIC_FRAME_JSON_SCHEMA
          from semantic_model_registry import MODEL_SPECS

          headers = {
              'Modal-Key': os.environ['MODAL_TOKEN_ID'],
              'Modal-Secret': os.environ['MODAL_TOKEN_SECRET'],
              'Content-Type': 'application/json',
          }
          payload = {
              'query': '松山市で無料のイベントを探したい',
              'state': {},
              'grounded': {},
              'format_enforcer': 'lmfe',
          }

          for spec in MODEL_SPECS:
              last_error = None
              for attempt in range(1, 13):
                  try:
                      response = requests.post(
                          spec.deployed_url,
                          headers=headers,
                          json=payload,
                          timeout=240,
                          allow_redirects=False,
                      )
                      if response.status_code != 200:
                          raise RuntimeError(f'HTTP {response.status_code}: {response.text[:300]}')
                      body = response.json()
                      if body.get('service_id') != 'ehime-kokubunsai-semantic-v2-2-api':
                          raise RuntimeError(f'unexpected service_id: {body.get("service_id")}')
                      if body.get('model_key') != spec.key:
                          raise RuntimeError(f'unexpected model_key: {body.get("model_key")}')
                      if body.get('model_id') != spec.model_id:
                          raise RuntimeError(f'unexpected model_id: {body.get("model_id")}')
                      answer = body.get('answer')
                      if not isinstance(answer, str) or not answer.strip():
                          raise RuntimeError(f'empty answer: {body.get("error")}')
                      frame = json.loads(answer)
                      validate(frame, ATOMIC_FRAME_JSON_SCHEMA)
                      obs = body.get('observability') or {}
                      print(json.dumps({
                          'model_key': spec.key,
                          'status': 'PASS',
                          'attempt': attempt,
                          'prompt_tokens': obs.get('prompt_tokens'),
                          'generated_tokens': obs.get('generated_tokens'),
                          'server_total_ms': obs.get('server_total_ms'),
                      }, ensure_ascii=False))
                      last_error = None
                      break
                  except Exception as exc:
                      last_error = f'{type(exc).__name__}: {exc}'
                      print(f'{spec.key} attempt {attempt}/12 not ready: {last_error[:500]}')
                      if attempt < 12:
                          time.sleep(20)
              if last_error is not None:
                  raise RuntimeError(f'{spec.key} endpoint smoke failed: {last_error}')
          PY
