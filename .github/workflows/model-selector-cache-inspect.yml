name: Inspect LLM-jp Semantic v2.2 cache

on:
  push:
    branches:
      - feature/model-selector-llmjp-v22
    paths:
      - .github/workflows/model-selector-cache-inspect.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: ehime-kokubunsai-ai-poc
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade modal
      - name: Inspect committed LLM-jp volume snapshot
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          modal volume ls --json ehime-kokubunsai-llmjp-4-8b-cache / > volume.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('volume.json').read_text())
          print(json.dumps(payload, ensure_ascii=False)[:5000])
          text = json.dumps(payload, ensure_ascii=False)
          required = ('config.json', 'model-00001-of-00004.safetensors', 'model-00004-of-00004.safetensors')
          missing = [name for name in required if name not in text]
          if missing:
              raise SystemExit(f'cache not committed/complete; missing {missing}')
          print('LLM-jp committed cache markers: PASS')
          PY
