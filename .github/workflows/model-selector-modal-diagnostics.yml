name: Inspect model-selector Modal activity

on:
  push:
    branches:
      - feature/model-selector-llmjp-v22
    paths:
      - .github/workflows/model-selector-modal-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: ehime-kokubunsai-ai-poc
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade modal
      - name: Inspect recent Modal app activity
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          modal app list --json
          echo '--- recent semantic v2.2 logs ---'
          modal app logs ehime-kokubunsai-semantic-v2-2-api --since 30m --tail 500 --timestamps || true
