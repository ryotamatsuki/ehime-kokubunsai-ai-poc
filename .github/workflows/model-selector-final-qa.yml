name: Final model-selector full QA

on:
  push:
    branches:
      - feature/model-selector-llmjp-v22
    paths:
      - .github/workflows/model-selector-final-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/model-selector-llmjp-v22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'lm-format-enforcer>=0.10,<1'
      - name: Compile all Python sources
        run: python -m compileall -q .
      - name: Run standalone deterministic QA
        run: |
          python tests/run_search_v2_qa.py
          python tests/run_conversation_router_qa.py
          python tests/run_conversational_recovery_qa.py
          python tests/run_recovery_v2_qa.py
          python tests/run_participation_qa.py
          python tests/run_recommendation_qa.py
          python tests/run_pending_recommendation_qa.py
          python tests/run_agentic_search_qa.py
          python tests/run_command_semantic_qa.py
          python tests/run_security_qa.py
          python tests/run_recovery_benchmark.py
      - name: Run full pytest suite
        run: PYTHONPATH=. python -m pytest -q
      - name: Verify v2.2 oracle ceiling
        run: |
          PYTHONPATH=. python - <<'PY'
          from semantic_oracle_ceiling_v2_2 import evaluate_oracle_v22
          result = evaluate_oracle_v22()
          assert result['cases'] == 100
          assert result['machine_pass'] == 100, result['failed']
          print('v2.2 oracle: 100/100 PASS')
          PY
      - name: Verify model-selector contract
        run: |
          PYTHONPATH=. python - <<'PY'
          from pathlib import Path
          from semantic_model_registry import DEFAULT_MODEL_KEY, MODEL_SPECS, resolve_model_url
          assert [spec.key for spec in MODEL_SPECS] == ['sarashina-2.2-3b', 'llm-jp-4-8b']
          assert DEFAULT_MODEL_KEY == 'sarashina-2.2-3b'
          assert all(resolve_model_url(spec, {}).startswith('https://') for spec in MODEL_SPECS)
          source = Path('streamlit_app.py').read_text(encoding='utf-8')
          assert 'st.selectbox(' in source and '"AIモデル"' in source
          assert 'semantic_model_registry.resolve_model_url(selected_model, st.secrets)' in source
          assert 'run_semantic_v22(' in source
          assert 'active_semantic_model_key' in source
          assert '会話をリセットしました' in source
          print('model-selector contract: PASS')
          PY
      - name: Verify sealed holdout remains opaque
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('tests/data/unexpected_utterances_holdout_v2_1')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          payload = root / manifest['payload']
          digest = hashlib.sha256(payload.read_bytes()).hexdigest()
          assert digest == manifest['payload_sha256']
          assert digest == 'c844dda17248c0e7f16cd2985652e62bb0f8b601bf21196d6801479580899c92'
          print(json.dumps({'opened': False, 'sha256': digest}, ensure_ascii=False))
          PY
