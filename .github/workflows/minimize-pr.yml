name: Minimize suitability PR diff

on:
  push:
    branches:
      - fix/ambiguous-suitability-clarification

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base main
        run: git fetch origin main

      - name: Restore original orchestrator and apply minimal patch
        shell: bash
        run: |
          git show origin/main:command_orchestrator.py > command_orchestrator.py
          python - <<'PY'
          from pathlib import Path

          path = Path("command_orchestrator.py")
          text = path.read_text(encoding="utf-8")

          import_anchor = "import experience_preferences\n"
          if "import suitability_clarification\n" not in text:
              if import_anchor not in text:
                  raise SystemExit("import anchor not found")
              text = text.replace(
                  import_anchor,
                  import_anchor + "import suitability_clarification\n",
                  1,
              )

          marker = "\n        generation_ms = 0.0\n"
          if marker not in text:
              raise SystemExit("generation anchor not found")
          guard = """
          if command_plan is None:
              suitability = suitability_clarification.analyze_suitability_request(value)
              if suitability.needs_clarification:
                  self._current_observation.deterministic_route = "ambiguous_suitability_guard"
                  self._current_observation.deterministic_confidence = "high"
                  plan = self._unsupported_plan()
                  return self._result(
                      plan=plan,
                      status="clarification",
                      message=suitability_clarification.clarification_message(value),
                      latency=CommandLatency(total_ms=(time.perf_counter() - started) * 1000),
                  )
              if suitability.should_strip_suitability_marker:
                  value = suitability.sanitized_query
          """
          guard = "\n".join(
              ("        " + line if line else line)
              for line in guard.strip("\n").splitlines()
          ) + "\n"
          text = text.replace(marker, "\n" + guard + marker.lstrip("\n"), 1)
          path.write_text(text, encoding="utf-8")
          PY

          rm -f command_orchestrator_core.py
          rm -f .github/workflows/minimize-pr.yml

      - name: Run focused QA
        run: |
          python -m pip install --upgrade pytest
          python -m compileall -q command_orchestrator.py suitability_clarification.py tests/test_suitability_clarification.py
          python -m pytest -q tests/test_suitability_clarification.py

      - name: Commit minimized implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: minimize suitability clarification diff"
          git push origin HEAD:fix/ambiguous-suitability-clarification
